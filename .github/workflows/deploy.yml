name: Build and Deploy Jekyll

on:
  push:
    branches:
      - jekyll
  pull_request:
    branches:
      - jekyll

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Setup Ruby environment
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      # 3. Install bundler and gems from Gemfile
      - name: Install Jekyll & Bundler
        run: |
          gem install bundler
          bundle install

      # 4. Build the Jekyll site (runs your _plugins/generate_metadata.rb)
      - name: Build Jekyll site
        run: bundle exec jekyll build

      # 5. Deploy built site to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
