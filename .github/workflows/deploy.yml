name: Build and Deploy Jekyll

on:
  push:
    branches:
      - jekyll
      - preview
  pull_request:
    branches:
      - jekyll
      - preview

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      # 3. Install dependencies
      - name: Install Jekyll & Bundler
        run: |
          gem install bundler
          bundle install

      # 4a. Build site for jekyll branch
      - name: Build site (jekyll branch)
        if: github.ref == 'refs/heads/jekyll'
        run: bundle exec jekyll build --baseurl "/thingsyoucando"

      # 4b. Build site for preview branch
      - name: Build site (preview branch)
        if: github.ref == 'refs/heads/preview'
        run: bundle exec jekyll build --baseurl "/thingsyoucando/preview"

      # 5a. Deploy to gh-pages (main site)
      - name: Deploy live site
        if: github.ref == 'refs/heads/jekyll'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: /

      # 5b. Deploy preview site to subdirectory
      - name: Deploy preview site
        if: github.ref == 'refs/heads/preview'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: preview
