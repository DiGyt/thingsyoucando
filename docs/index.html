<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Things You Can Do</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <h1>Things You Can Do</h1>

  <!-- Filter UI -->
  <div id="filters">
    <select id="country">
      <option value="">All Countries</option>
      <option value="France">France</option>
      <option value="USA">USA</option>
    </select>

    <select id="time">
      <option value="">All Durations</option>
      <option value="5 minutes">5 minutes</option>
      <option value="30 minutes">30 minutes</option>
    </select>

    <label>
      <input type="checkbox" id="online"> Online only
    </label>

    <fieldset>
      <legend>Capabilities</legend>
      <label><input type="checkbox" value="ecology" class="capabilities"> Ecology</label>
      <label><input type="checkbox" value="law" class="capabilities"> Law</label>
      <label><input type="checkbox" value="language" class="capabilities"> Language</label>
    </fieldset>

    <fieldset>
      <legend>Interests</legend>
      <label><input type="checkbox" value="nature" class="interests"> Nature</label>
      <label><input type="checkbox" value="volunteering" class="interests"> Volunteering</label>
      <label><input type="checkbox" value="education" class="interests"> Education</label>
    </fieldset>
  </div>

  <!-- Filtered results -->
  <ul id="results"></ul>

  <!-- Post Modal -->
  <div id="post-modal" class="modal">
    <div class="modal-content">
      <span id="modal-close" class="close">&times;</span>
      <div id="modal-post"></div>
    </div>
  </div>

  <script src="scripts/filter.js"></script>
</body>
</html>
