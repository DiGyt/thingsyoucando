<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Things You Can Do</title>
  <link rel="stylesheet" href="/thingsyoucando/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-overlay">
    <div class="container">
      <h1>Things You Can Do</h1>
    </div>
  </div>
</header>

<!-- Floating filters box -->
<div id="filters" class="filters container">
  <div class="filter-group">
    <label for="filter-country">Country:</label>
    <select id="filter-country">
      <option value="">All Countries</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-duration">Duration:</label>
    <select id="filter-duration">
      <option value="">All Durations</option>
    </select>
  </div>

  <div class="filter-group">
    <label><input type="checkbox" id="filter-online"> Online only</label>
  </div>

  <fieldset id="filter-categories" class="filter-group">
    <legend>Categories:</legend>
    <!-- JS dynamically adds category checkboxes here -->
  </fieldset>
</div>

<!-- Full-width overlay behind main content -->
<div class="main-content-overlay">
  <main id="things-list" class="things-list container">
    <!-- JS populates this list -->
  </main>
</div>

<!-- Pass baseurl to JS -->
<script>
  const baseurl = "/thingsyoucando";
</script>

<!-- Load precomputed filters (built at build time) -->
<script src="/thingsyoucando/assets/data/filters.js"></script>

<!-- Load main JS -->
<script src="/thingsyoucando/assets/js/main.js"></script>

</body>
</html>
