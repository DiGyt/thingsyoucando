---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Things You Can Do</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  <style>
    /* --- Local search settings: compact box --- */
    #local-search-settings {
      display: none;
      position: absolute; /* float independently */
      background: white;
      padding: 0.5em;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-top: 0.25em;
      z-index: 1000;
      width: 220px;
    }

    #local-search-settings label,
    #local-search-settings input,
    #local-search-settings select,
    #local-search-settings button {
      display: block;
      width: 100%;
      margin: 0.25em 0;
    }

    /* Suggestions dropdown: independent floating box */
    #local-search-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 0 0 5px 5px;
      list-style: none;
      padding: 0;
      margin: 0;
      z-index: 2000;
      display: none; /* hidden by default */
    }

    #local-search-suggestions li {
      padding: 0.25em 0.5em;
      cursor: pointer;
    }

    #local-search-suggestions li:hover {
      background-color: #f0f0f0;
    }

    /* Positioning wrapper relative to checkbox */
    .filter-group.local-wrapper {
      position: relative;
    }
  </style>
</head>
<body>

<!-- Global dark overlay behind everything -->
<div class="page-overlay"></div>

<header class="site-header">
  <div class="header-overlay">
    <div class="container">
      <h1>Things You Can Do</h1>
    </div>
  </div>
</header>

<!-- Floating filters box -->
<div id="filters" class="filters container">
  <div class="filter-group">
    <label for="filter-country">Country:</label>
    <select id="filter-country">
      <option value="">All Countries</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-duration">Duration:</label>
    <select id="filter-duration">
      <option value="">All Durations</option>
    </select>
  </div>

  <div class="filter-group">
    <label><input type="checkbox" id="filter-online"> Online only</label>
  </div>

  <fieldset id="filter-categories" class="filter-group">
    <legend>Categories:</legend>
    <!-- JS dynamically adds category checkboxes here -->
  </fieldset>

  <!-- Local search toggle + wrapper -->
  <div class="filter-group local-wrapper">
    <label><input type="checkbox" id="filter-local"> Search locally</label>

    <!-- Local search input + radius + search button -->
    <div id="local-search-settings">
      <label for="local-search-location">Location:</label>
      <input type="text" id="local-search-location" placeholder="Enter city or coordinates">

      <label for="local-search-radius">Radius:</label>
      <select id="local-search-radius">
        <option value="1">1 km</option>
        <option value="5">5 km</option>
        <option value="10">10 km</option>
        <option value="25">25 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
        <option value="500">500 km</option>
      </select>

      <button id="local-search-button">Search</button>

      <!-- Suggestions dropdown -->
      <ul id="local-search-suggestions"></ul>
    </div>
  </div>
</div>

<main id="things-list" class="things-list container">
  <!-- JS populates this list -->
</main>

<!-- Pass baseurl to JS -->
<script>
  const baseurl = "{{ site.baseurl }}";

  // Toggle local search settings visibility
  const localCheckbox = document.getElementById('filter-local');
  const localSettings = document.getElementById('local-search-settings');
  localCheckbox.addEventListener('change', () => {
    localSettings.style.display = localCheckbox.checked ? 'block' : 'none';
  });
</script>

<!-- Load precomputed filters (built at build time) -->
<script src="{{ site.baseurl }}/assets/data/filters.js"></script>

<!-- Load main JS -->
<script src="{{ site.baseurl }}/assets/js/main.js"></script>

</body>
</html>
