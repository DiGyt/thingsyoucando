---
layout: default
---

<div id="filters" class="filters">
  <select id="filter-country">
    <option value="">All Countries</option>
    <option>France</option>
    <option>USA</option>
  </select>

  <select id="filter-duration">
    <option value="">All Durations</option>
    <option>5 minutes</option>
    <option>30 minutes</option>
  </select>

  <label><input type="checkbox" id="filter-online"> Online only</label>

  <fieldset id="filter-categories">
    <legend>Categories:</legend>
    <label><input type="checkbox" value="Ecology"> Ecology</label>
    <label><input type="checkbox" value="Law"> Law</label>
    <label><input type="checkbox" value="Volunteering"> Volunteering</label>
  </fieldset>
</div>

<div id="things-list" class="things-list">
  <!-- JS populates this list -->
</div>

<script>
  const baseurl = "{{ site.baseurl }}";
</script>
<script src="{{ site.baseurl }}/assets/js/main.js"></script>
