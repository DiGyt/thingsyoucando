<h2 class="page-title">Submit Your Thing</h2>

<form id="customForm" class="custom-form">
  <label for="title">Title</label>
  <input type="text" id="title" required>

  <label for="country">Country</label>
  <input type="text" id="country">

  <label for="fromHome">Can you do this from home? (Yes/No)</label>
  <select id="fromHome">
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <label for="categories">Categories (comma‑separated)</label>
  <input type="text" id="categories">

  <label for="restricted">Is this thing restricted? (Yes/No)</label>
  <select id="restricted">
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <label for="location">Location</label>
  <input type="text" id="location">

  <label for="description">Description</label>
  <textarea id="description" rows="4"></textarea>

  <button type="submit" id="submitBtn">Submit</button>
</form>

<div class="message" id="message"></div>

<script>
const form = document.getElementById('customForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  messageDiv.textContent = "Submitting form…";

  const gFormData = new FormData();
  gFormData.append("entry.190422142", document.getElementById('title').value);
  gFormData.append("entry.1866049912", document.getElementById('country').value);
  gFormData.append("entry.1972481565", document.getElementById('fromHome').value);
  gFormData.append("entry.657983376", document.getElementById('categories').value);
  gFormData.append("entry.1609013511", document.getElementById('restricted').value);
  gFormData.append("entry.1394052519", document.getElementById('location').value);
  gFormData.append("entry.952001199", document.getElementById('description').value);

  try {
    await fetch("https://docs.google.com/forms/d/e/1FAIpQLScmTL4J_Ph2jpx-dZlEmtpW_UA0Jp_rkcmJSxNzMcN94N__dw/formResponse", {
      method: "POST",
      mode: "no-cors",
      body: gFormData
    });
    messageDiv.textContent = "Submitted successfully!";
    form.reset();
  } catch (err) {
    messageDiv.textContent = "Submission error: " + err.message;
  }
  submitBtn.disabled = false;
});
</script>
